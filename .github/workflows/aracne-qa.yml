name: Aracne QA
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Run unit and DOM regression tests
        run: npm test
      - name: Validate isolated Lab and synthetic database recovery
        run: npm run test:lab
      - name: Install Chromium for isolated browser tests
        run: npx playwright install --with-deps chromium
      - name: Exercise Lab in Chromium (external requests blocked)
        run: npm run test:lab:browser
      - name: Exercise sharing UI and reconnect on synthetic SQL
        run: npm run test:lab:ui
